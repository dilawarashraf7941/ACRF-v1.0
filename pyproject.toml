[project]
name = "adaptive-critic-routing"
version = "0.1.0"
description = "Adaptive Critic Routing Framework (ACRF) - a modular LangGraph-based agent system with critic-driven adaptive routing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "ACRF Contributors" }]

dependencies = [
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "litellm>=1.52",
    "chromadb>=0.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
